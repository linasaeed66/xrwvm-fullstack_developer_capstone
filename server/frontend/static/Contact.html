
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Best Cars Dealerships</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light"
         style="background-color: darkturquoise; min-height: 1in;">

        <div class="container-fluid">

            <h2 style="padding-right: 5%;">Dealerships</h2>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarText"
                    aria-controls="navbarText"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarText">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" style="font-size: larger;" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" style="font-size: larger;"
                           href="/contact" aria-current="page">Contact Us</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Contact Us Content -->
    <div class="container mt-5 mb-5">

        <div class="text-center mb-4">
            <h1>Contact Us</h1>

            <p class="lead">
                We'd love to hear from you!
            </p>

            <p>
                If you have questions, feedback or need assistance,
                please get in touch with our team.
            </p>
        </div>

        <div class="card mx-auto" style="max-width: 650px;">

            <div class="card-body">

                <h4 class="card-title text-center mb-4">
                    Send Us a Message
                </h4>

                <form>

                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control"
                               id="name" placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               id="email" placeholder="Enter your email address">
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control"
                               id="subject" placeholder="Enter the subject">
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message"
                                  rows="5"
                                  placeholder="Write your message here"></textarea>
                    </div>

                    <div class="text-center">
                        <button type="button" class="btn btn-primary">
                            Send Message
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
